[project]
name = "voidsight"
version = "0.2.0"
description = "Linux Warframe companion: OCRs the relic reward screen and prices the drops from warframe.market"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The desktop client. Also the toolkit an in-game overlay would use. On Linux
# this pulls in X11 capture too: `--extra desktop` alone installed a client that
# could not see the game, which is not a distinction worth making someone learn.
desktop = [
    "PySide6>=6.7",
    "qtawesome>=1.3",
    "python-xlib>=0.33; sys_platform == 'linux'",
]
# Capture on its own, for a headless or CLI-only install.
x11 = ["python-xlib>=0.33; sys_platform == 'linux'"]
portal = ["dbus-next>=0.2.3", "PyGObject>=3.48"]

[project.scripts]
voidsight = "voidsight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voidsight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
